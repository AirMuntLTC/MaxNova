plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maxnova.app'
    compileSdk 35
        buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'com.maxnova.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
}
